[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convolution"
version = "0.4.0"
description = "Convolve in-situ hyperspectral reflectance to satellite sensor bands."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Lomeo", email = "davide.lomeo@kcl.ac.uk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.7",
    "netCDF4>=1.7",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dask = ["dask[array]"]
test = ["pytest>=8", "dask[array]"]

[project.scripts]
satconv = "convolution.cli:main"

[project.urls]
Homepage = "https://github.com/davidelomeo/satconv"

[tool.setuptools]
packages = ["convolution"]

[tool.setuptools.package-data]
convolution = ["SRFs_and_bandpasses/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
